<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Monitoring Dashboard</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 24px; background: #f5f6f8; color: #111; }
      .wrap { max-width: 980px; margin: 0 auto; }
      .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); margin-bottom: 12px; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .kpi { border: 1px solid #e6e8eb; border-radius: 10px; padding: 10px; }
      input { width: 100%; padding: 8px; border: 1px solid #d0d7de; border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { border-top: 1px solid #e6e8eb; padding: 8px; text-align: left; }
      @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Hongmyungbo Traffic Monitoring</h1>
        <p>collector API 기준 트래픽/예상수익 모니터링</p>
      </div>

      <div class="card grid">
        <label>CPM<input id="cpm" type="number" value="1.8" step="0.1" /></label>
        <label>CTR<input id="ctr" type="number" value="0.012" step="0.001" /></label>
        <label>CPC<input id="cpc" type="number" value="0.18" step="0.01" /></label>
        <label>Fill Rate<input id="fillRate" type="number" value="0.65" step="0.01" /></label>
      </div>

      <div class="card">
        <button id="refresh">새로고침</button>
      </div>

      <div class="card grid" id="kpis"></div>

      <div class="card">
        <table>
          <thead><tr><th>Day</th><th>PV</th><th>Generate</th><th>Refine</th><th>Publish</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <script>
      async function load() {
        const cpm = document.getElementById('cpm').value;
        const ctr = document.getElementById('ctr').value;
        const cpc = document.getElementById('cpc').value;
        const fillRate = document.getElementById('fillRate').value;
        const res = await fetch(`/api/summary?days=14&cpm=${cpm}&ctr=${ctr}&cpc=${cpc}&fillRate=${fillRate}&slotsPerPage=2`);
        const data = await res.json();

        document.getElementById('kpis').innerHTML = [
          ['PageViews', data.totals.pageViews],
          ['TotalEvents', data.totals.totalEvents],
          ['Impressions', data.revenueEstimate.impressions],
          ['Clicks', data.revenueEstimate.estimatedClicks],
          ['CPM Revenue', '$' + data.revenueEstimate.cpmBasedRevenue.toFixed(4)],
          ['CPC Revenue', '$' + data.revenueEstimate.cpcBasedRevenue.toFixed(4)],
          ['Estimated', '$' + data.revenueEstimate.estimatedRevenue.toFixed(4)],
          ['Monthly', '$' + data.revenueEstimate.projectedMonthlyRevenue.toFixed(4)]
        ].map(([k,v]) => `<div class="kpi"><strong>${k}</strong><div>${v}</div></div>`).join('');

        document.getElementById('rows').innerHTML = data.daily.map(r => `<tr><td>${r.day}</td><td>${r.pageViews}</td><td>${r.generateCount}</td><td>${r.refineCount}</td><td>${r.publishCount}</td></tr>`).join('');
      }
      document.getElementById('refresh').addEventListener('click', load);
      load();
    </script>
  </body>
</html>
